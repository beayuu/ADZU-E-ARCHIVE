kind = "web"
previewPath = "/"
title = "AdZU Registrar E-Archive"
description = "A desktop-first, offline-friendly document archiving workspace for Ateneo de Zamboanga University Registrar staff to scan, label, organize, search, and retrieve student records locally."
version = "1.0.0"
id = "artifacts/adzu-registrar-archive"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18924

[services.development]
run = "pnpm --filter @workspace/adzu-registrar-archive run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/adzu-registrar-archive", "run", "build" ]
serve = "static"
publicDir = "artifacts/adzu-registrar-archive/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18924"
BASE_PATH = "/"
